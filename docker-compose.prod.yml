version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: eduplatform_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - eduplatform_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eduplatform_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - eduplatform_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eduplatform_backend_prod
    restart: always
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    env_file:
      - ./backend/.env.prod
    depends_on:
      - postgres
      - redis
    networks:
      - eduplatform_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eduplatform_celery_prod
    restart: always
    command: celery -A project worker -l info --concurrency=4
    volumes:
      - media_volume:/app/media
      - ./logs:/app/logs
    env_file:
      - ./backend/.env.prod
    depends_on:
      - postgres
      - redis
    networks:
      - eduplatform_network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eduplatform_beat_prod
    restart: always
    command: celery -A project beat -l info
    volumes:
      - ./logs:/app/logs
    env_file:
      - ./backend/.env.prod
    depends_on:
      - postgres
      - redis
    networks:
      - eduplatform_network

  nginx:
    image: nginx:alpine
    container_name: eduplatform_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - eduplatform_network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: eduplatform_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  eduplatform_network:
    driver: bridge