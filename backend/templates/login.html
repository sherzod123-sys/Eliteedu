<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Xodimlar Tizimi - Kirish</title>
    <style>
        body {font-family: Arial; text-align: center; padding-top: 80px; background: #f4f4f4;}
        .box {width: 400px; margin: 0 auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1);}
        input, button {width: 100%; padding: 12px; margin: 10px 0; font-size: 16px;}
        button {background: #007bff; color: white; border: none; cursor: pointer;}
        pre {text-align: left; background: #f0f0f0; padding: 15px; border-radius: 5px; margin-top: 20px;}
    </style>
</head>
<body>
<div class="box">
    <h2>Xodimlar tizimiga kirish</h2>
    <input type="text" id="phone" value="+998999887766" placeholder="Telefon"><br>
    <input type="password" id="pass" value="Xodim2025!" placeholder="Parol"><br>
    <button onclick="login()">Kirish</button>
    <pre id="result"></pre>
</div>

<script>
async function login() {
    const res = await fetch('/api/users/auth/login/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            phone: document.getElementById('phone').value,
            password: document.getElementById('pass').value
        })
    });
    const data = await res.json();
    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    if (res.ok) document.getElementById('result').style.color = 'green';
}
if (res.ok) {
    localStorage.setItem('access_token', data.tokens.access);
    localStorage.setItem('refresh_token', data.tokens.refresh);
    document.getElementById('result').style.color = 'green';
    document.getElementById('result').textContent = 'Kirish muvaffaqiyatli! Bosh sahifaga o‘tilyapti...';
    setTimeout(() => window.location.href = '/home/', 1500);  // ← home ga yo‘naltirish
}
</script>
</body>
</html>
